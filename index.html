<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Saulo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
</head>

<body>
    <div class="formato">
        <div class="contorno">
            <h2>Formulário Atividade Mascara</h2>
            <h3>Coloque seus Dados</h3>

            <form action="#" method="POST" class="meu-formulario" onsubmit="mostrarToast(event)">

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Escreva seu Nome" required>
                <br>

                <label for="end">Endereço</label>
                <input type="text" id="end" placeholder="Escreva seu Endereço" required>
                <br>

                <label for="cep">CEP</label>
                <input type="text" id="cep" placeholder="00.000-000" maxlength="10" oninput="mascara_cep()">
                <br>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascara_cpf()">
                <br>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="+55 (00) 0 0000-0000" maxlength="20"
                    oninput="mascara_telefone()">
                <br>

                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascara_cnpj()">
                <br>

                <div>
                    <button type="submit" class="btn secondary">Enviar</button>
                </div>

            </form>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="meuToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-bg-success">
                <strong class="me-auto">Sucesso!</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Formulário enviado!
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
